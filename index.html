<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PSE Photo Booth</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>


<body>


    <!-- =========================
         HOME
    ========================== -->

    <section
        id="home"
        class="page active">

        <img
            src="assets/logo-pse.png"
            class="home-logo"
            alt="Pojok Santai Enak">

        <h1>PHOTO BOOTH</h1>

        <p class="welcome-text">
            Abadikan momen seru kamu
            <br>
            di Pojok Santai Enak
        </p>


        <img
            src="assets/gelato-cup.png"
            class="home-decoration gelato-decoration"
            alt="">

        <img
            src="assets/ayam-paha.png"
            class="home-decoration chicken-decoration"
            alt="">


        <button
            id="startBtn"
            class="main-button">

            MULAI FOTO

        </button>


        <div class="instruction">

            <div class="instruction-item">
                <strong>01</strong>
                <span>
                    Izinkan<br>
                    Kamera
                </span>
            </div>

            <div class="instruction-item">
                <strong>02</strong>
                <span>
                    Pose
                </span>
            </div>

            <div class="instruction-item">
                <strong>03</strong>
                <span>
                    Foto<br>
                    3x
                </span>
            </div>

            <div class="instruction-item">
                <strong>04</strong>
                <span>
                    Download
                </span>
            </div>

        </div>

    </section>



    <!-- =========================
         CAMERA
    ========================== -->

    <section
        id="cameraPage"
        class="page camera-page">

        <div class="camera-container">

            <video
                id="video"
                autoplay
                playsinline>
            </video>


            <div
                id="countdown"
                class="countdown">
            </div>


            <img
                src="assets/doodle-hati.png"
                class="camera-decoration camera-heart"
                alt="">


            <img
                src="assets/ayam-sayap.png"
                class="camera-decoration camera-chicken"
                alt="">

        </div>


        <p
            id="photoNumber"
            class="photo-number">

            Foto 1 dari 3

        </p>


        <button
            id="captureBtn"
            class="capture-button">

            FOTO

        </button>

    </section>



    <!-- =========================
         RESULT
    ========================== -->

    <section
        id="resultPage"
        class="page result-page">

        <h2>
            Foto kamu sudah siap!
        </h2>

        <p class="result-description">
            Simpan kenanganmu dari
            <br>
            Pojok Santai Enak.
        </p>


        <div class="result-container">

            <canvas
                id="resultCanvas">
            </canvas>

        </div>


        <button
            id="downloadBtn"
            class="main-button">

            DOWNLOAD FOTO

        </button>


        <button
            id="retryBtn"
            class="secondary-button">

            AMBIL ULANG

        </button>

    </section>



    <!-- Canvas foto mentah -->

    <canvas
        id="photoCanvas"
        style="display:none;">
    </canvas>



    <script src="script.js"></script>

</body>

</html>
